services:
  dev:
    build:
      context: .
      dockerfile_inline: |
        FROM cr.yandex/mirror/library/debian:trixie-slim
        ENV LC_ALL=C
        ENV VCPKG_ROOT=/opt/vcpkg
        ENV VCPKG_DISABLE_METRICS=1
        ENV DEBIAN_FRONTEND=noninteractive
        ENV PATH="/opt/cmake/bin:$${VCPKG_ROOT}:${PATH}"
        RUN sed -i 's|deb.debian.org|mirror.yandex.ru|g' /etc/apt/sources.list.d/debian.sources
        RUN apt-get update \
         && apt-get install -y --no-install-recommends g++ make git curl zip unzip pkg-config ca-certificates xz-utils \
         && rm -rf /var/lib/apt/lists/*
        RUN curl -sSLfo /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v4.4.0/cmake-4.4.0-linux-x86_64.tar.gz \
         && mkdir -p /opt/cmake && tar xf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1 && rm /tmp/cmake.tar.gz
        RUN curl -sSLfo /tmp/ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip \
         && unzip -q /tmp/ninja.zip -d /opt/cmake/bin && rm /tmp/ninja.zip
        RUN git clone https://github.com/microsoft/vcpkg $${VCPKG_ROOT} \
         && $${VCPKG_ROOT}/bootstrap-vcpkg.sh -disableMetrics
    security_opt:
      - seccomp:unconfined
    image: multithreading
    init: true
    working_dir: /src
    environment:
      HOME: /tmp
    volumes:
      - .:/src
